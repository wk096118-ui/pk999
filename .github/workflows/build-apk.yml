name: Build APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Native Android APK
        run: |
          gradle :app:assembleDebug || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create package.json
        run: |
          echo '{"name": "pk999", "version": "1.0.0", "dependencies": {"cordova": "^12.0.0"}}' > package.json

      - name: Install Cordova
        run: npm install -g cordova

      - name: Setup Cordova Project
        run: |
          cordova create myApp com.pk999.app PK999
          cd myApp

          # Clean www folder and copy real self-contained web app
          rm -rf www/*
          cp ../index.html www/index.html

          # Configure config.xml with extended timeout and https localhost scheme
          cat <<EOF > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.pk999.app" version="1.0.0" xmlns="http://www.w3.org/ns/widgets" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>PK999</name>
              <description>PK999 Official Gaming App</description>
              <author email="dev@pk999.app">PK999</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="*" />
              <preference name="loadUrlTimeoutValue" value="70000" />
              <preference name="Scheme" value="https" />
              <preference name="Hostname" value="localhost" />
              <preference name="AndroidInsecureFileModeEnabled" value="true" />
              <preference name="MixedContentMode" value="0" />
          </widget>
          EOF

          cordova platform add android

      - name: Build Cordova Debug APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Build Cordova Release AAB
        run: |
          cd myApp
          cordova build android --release -- --packageType=bundle

      - name: Upload Native APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PK999-Native-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Cordova APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PK999-Cordova-Debug-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Upload Cordova AAB Bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PK999-Cordova-Release-AAB
          path: myApp/platforms/android/app/build/outputs/bundle/release/*.aab
