name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create package.json
        run: |
          echo '{"name": "pk999", "version": "1.0.0", "dependencies": {"cordova": "^12.0.0"}}' > package.json

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myApp com.pk999.app PK999
          cp index.html myApp/www/index.html || cp *.html myApp/www/index.html
          cd myApp
          cordova platform add android

      - name: Build Android APK
        run: |
          cd myApp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PK999-Debug-APK
          path: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
          
