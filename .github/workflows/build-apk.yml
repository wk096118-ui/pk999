name: Generate APK from Web App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Build Android Package via PWABuilder CLI
        uses: pwabuilder/pwabuilder-action@main
        with:
          url: https://wk096118-ui.github.io/pk999/
          platform: android
          output: android-out
          
